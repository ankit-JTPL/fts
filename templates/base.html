{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Future Technologies Summit is a premier tech conference showcasing AI, robotics, cybersecurity, and next-generation innovations. Join industry leaders and explore the future of technology.">
    <meta name="keywords" content="technology summit, AI conference, robotics event, tech expo, innovation conference, future tech, cybersecurity event">
    <meta name="author" content="Future Technologies Summit">
    <!-- Indexing -->
    <meta name="robots" content="index, follow">
	<!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
	<meta property="og:type" content="website">
	<meta property="og:title" content="{% block og_title %}Future Technologies Summit{% endblock %}">
	<meta property="og:description" content="{% block og_description %}Discover AI, robotics, and emerging technologies at the Future Technologies Summit.{% endblock %}">
	<meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/seo-banner.png' %}{% endblock %}">
	<meta property="og:url" content="{{ request.build_absolute_uri }}">
	<meta property="og:site_name" content="Future Technologies Summit">
	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{% block twitter_title %}Future Technologies Summit{% endblock %}">
	<meta name="twitter:description" content="{% block twitter_description %}Join the biggest future tech conference featuring AI, robotics, and innovation leaders.{% endblock %}">
	<meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/seo-banner.png' %}{% endblock %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
	<!-- Favicon -->
	<link rel="icon" type="image/png" href="{% static 'images/logo/logo.png' %}">
	<!-- CSS -->
	<link rel="stylesheet" href="{% static 'css/output.css'%}">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">

	

	<title>{% block title %}Future Technologies Summit | AI, Robotics & Innovation Conference{% endblock %}</title>
</head>

<body>
  {% include "partials/messages.html" %}
  {% include "includes/header.html" %}


  {% block content %}
  
 
  {% endblock %}

  {% include "includes/footer.html" %}
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollSmoother.min.js"></script>
	<script src="{% static 'js/main.js' %}"> </script>
	<script src="{% static 'js/motion.js' %}"> </script>
</body>


</html>
