{% load static %}
<footer class="relative overflow-hidden flex flex-col"
style="background-image: var(--gradient_secondary);">
  <div class="flex-1 flex flex-col items-center justify-center text-center px-6 py-16 sm:py-24">
    <img src="{% static 'images/logo/logo.png' %}" alt="A featured image for this section" class="mb-8 max-w-[160px] sm:max-w-[220px] opacity-90" />
    <h2 class="zoom-in font-black text-white text-[13vw] sm:text-6xl md:text-7xl lg:text-8xl leading-[0.95] uppercase max-w-5xl tracking-tight">
      The Future<br />Starts Here
    </h2>

    <p class="fade-up text-white/90 text-sm sm:text-base mt-8 sm:mt-10">
      Claim your place before it fills up.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-4 mt-8">
     <a href="{% url 'contact'  %}" class="btn btn-primary  group">
                <span>Contact Us</span>
                <span class="transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">↗</span>
              </a>
     <a href="{% url 'event-tickets'  %}" class="btn btn-secondary  group">
                <span>Explore Tickets</span>
                <span class="transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">↗</span>
              </a>
    </div>
  </div>

 <div class="px-6 sm:px-10 lg:px-16 pt-6 pb-8">
    <div class="max-w-7xl mx-auto">
        <div class="border-t border-white/20 mb-6"></div>

        <div class="flex flex-col md:flex-row justify-between items-center gap-4">

            <!-- Copyright -->
            <p class="text-[var(--text-light)] text-sm">
                © Livingstone Institute of Future Technologies.   All Rights Reserved.
            </p>

            <!-- Social Icons -->
            <div class="flex items-center gap-4 text-[var(--text-light)]">
                

                <a href="https://www.instagram.com/futuretechnologies_/" target="blank" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="https://www.youtube.com/@FutureTechnologiesFT/" target="blank" aria-label="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>

                <a href="https://www.linkedin.com/company/ft-future-technologies/" target="blank" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>

        </div>
    </div>
</div>
  </div>

</footer>
